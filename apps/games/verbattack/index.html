<!-- Top bar: team names, scores and hit messages -->
<div id="topbar" class="teams">
    <textarea placeholder="team 1" spellcheck="false" id="team1" class="teamboxes"></textarea>
    <div id="score1" class="score" title="Team 1 score">0</div>

    <div id="head" class="headmsg"><span class="msg">Left Side</span></div>
    <div id="controls">
        <input id="timerMin" type="number" min="1" max="99" value="5" title="Timer minutes" aria-label="Timer minutes">
        <button id="timerBtn" type="button" title="Start or reset the timer">Start</button>
        <span id="timerDisplay" title="Time left">--:--</span>
        <button id="endBtn" type="button" title="End the game and show the hidden insects">End game</button>
        <button id="newBtn" type="button" title="Start a new game">New game</button>
    </div>

    <div id="head2" class="headmsg right"><span class="msg">Right Side</span></div>

    <div id="score2" class="score" title="Team 2 score">0</div>
    <textarea placeholder="team 2" spellcheck="false" id="team2" class="teamboxes"></textarea>
</div>
